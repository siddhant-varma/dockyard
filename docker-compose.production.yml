services:
  dockyard-postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dockyard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dockyard}
    volumes:
      - dockyard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockyard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockyard

  dockyard-app:
    # Built by GitHub Actions on every merge to main (never on this host).
    # TAG pins a specific commit; rollback re-points :latest instead (rollback.yml).
    image: ghcr.io/siddhant-varma/dockyard:${TAG:-latest}
    pull_policy: always
    container_name: dockyard-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    ports:
      - "3001:3000"
    depends_on:
      dockyard-postgres:
        condition: service_healthy
    healthcheck:
      # Traefik only routes to healthy containers, so this must stay a pure
      # liveness check. A failed schema push is reported by the deep health
      # `schema` check instead (Kuma alerts on it), never here (BUG-024).
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DOCKYARD_DOMAIN: ${DOCKYARD_DOMAIN:-dockyard.cc}
      # server = Dokploy/GitHub discovery and MFA enforcement (CI-003)
      DOCKYARD_MODE: ${DOCKYARD_MODE:-server}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://dockyard.cc}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY}
      DOKPLOY_API_URL: ${DOKPLOY_API_URL}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN}
      HETZNER_SERVER_ID: ${HETZNER_SERVER_ID}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SSE_BROADCAST_SECRET: ${SSE_BROADCAST_SECRET:-}
      DOCKYARD_AUTH_ENABLED: ${DOCKYARD_AUTH_ENABLED:-true}
      DOCKYARD_ADMIN_USER: ${DOCKYARD_ADMIN_USER:-admin}
      DOCKYARD_ADMIN_PASSWORD: ${DOCKYARD_ADMIN_PASSWORD:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      DOCKYARD_DIAGNOSTIC: ${DOCKYARD_DIAGNOSTIC:-false}
      KUMA_URL: ${KUMA_URL:-}
      KUMA_API_KEY: ${KUMA_API_KEY:-}
      KUMA_USERNAME: ${KUMA_USERNAME:-}
      KUMA_PASSWORD: ${KUMA_PASSWORD:-}
      KUMA_WEBHOOK_SECRET: ${KUMA_WEBHOOK_SECRET:-}
      KUMA_PUSH_TOKEN: ${KUMA_PUSH_TOKEN:-}
      HEALTH_MONITOR_TOKEN: ${HEALTH_MONITOR_TOKEN:-}
      DOCKYARD_SESSION_IDLE_TIMEOUT: ${DOCKYARD_SESSION_IDLE_TIMEOUT:-1800}
      DOCKYARD_SESSION_ABSOLUTE_TIMEOUT: ${DOCKYARD_SESSION_ABSOLUTE_TIMEOUT:-28800}
    networks:
      - dockyard
      - dokploy-network

volumes:
  dockyard_pgdata:

networks:
  dockyard:
    driver: bridge
  dokploy-network:
    external: true
