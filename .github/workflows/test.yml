name: Test Suite
on:
  push:
    branches: [main, "feat/**", "testing"]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Runtime deps must be free of high/critical advisories. Dev tooling only
      # fails on critical: the braces/micromatch advisory (shadcn CLI, eslint
      # plugin) has no patched release yet.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      # The OpenAPI specs live in the private docs submodule, which CI cannot
      # check out; lint them only when present (local runs, private forks).
      - if: hashFiles('docs/api/openapi-core.yaml') != ''
        run: npx @redocly/cli lint docs/api/openapi-core.yaml docs/api/openapi-extended.yaml

  # Builds the production image on every run (no push) and checks that the
  # client-side flags baked into it match scripts/bundle-flags.baseline.
  image:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dockyard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Baked client flags match the baseline
        run: |
          docker create --name flags dockyard:ci
          docker cp flags:/app/.next ./image-next
          sh scripts/bundle-flags.sh ./image-next | diff -u scripts/bundle-flags.baseline -

  # main only: publish the image once every other job has passed. The build
  # reuses the GHA cache from the image job, so it is mostly a layer export.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [secret-scan, static-analysis, image, unit-integration, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/siddhant-varma/dockyard:${{ github.sha }}
            ghcr.io/siddhant-varma/dockyard:latest
          cache-from: type=gha

  # main only: Dokploy pulls the image just published (autoDeploy is off).
  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  unit-integration:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx vitest run --reporter=verbose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-results
          path: test-results/

  e2e:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          DOCKYARD_DEMO: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
