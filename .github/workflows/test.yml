name: Test Suite
on:
  push:
    branches: [main, "feat/**", "testing"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Runtime deps must be free of high/critical advisories. Dev tooling only
      # fails on critical: the braces/micromatch advisory (shadcn CLI, eslint
      # plugin) has no patched release yet.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      # The OpenAPI specs live in the private docs submodule, which CI cannot
      # check out; lint them only when present (local runs, private forks).
      - if: hashFiles('docs/api/openapi-core.yaml') != ''
        run: npx @redocly/cli lint docs/api/openapi-core.yaml docs/api/openapi-extended.yaml

  build:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          DOCKYARD_DEMO: "true"

  unit-integration:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx vitest run --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  e2e:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          DOCKYARD_DEMO: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
