services:
  dockyard-postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dockyard-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dockyard
      POSTGRES_PASSWORD: dockyard
      POSTGRES_DB: dockyard
    volumes:
      - dockyard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockyard"]
      interval: 10s
      timeout: 5s
      retries: 5

  dockyard-kuma:
    image: louislam/uptime-kuma:1
    container_name: dockyard-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - kuma-data:/app/data
    depends_on:
      dockyard-postgres:
        condition: service_healthy

volumes:
  dockyard_pgdata:
  kuma-data:
