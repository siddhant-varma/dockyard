<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- DockYard Logo — Glass Observatory style -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="20" y2="32">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0c8ce9"/>
    </linearGradient>
  </defs>
  <!-- Icon: hexagonal dock -->
  <path d="M12 4 L20 8.5 L20 17.5 L12 22 L4 17.5 L4 8.5 Z" stroke="url(#brand)" stroke-width="1.5" fill="none"/>
  <path d="M12 8 L16 13 L12 18 L8 13 Z" fill="url(#brand)" opacity="0.8"/>
  <circle cx="12" cy="13" r="1.5" fill="#fff" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="28" y="18" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="currentColor" letter-spacing="-0.02em">
    <tspan fill="currentColor">Dock</tspan><tspan fill="#3b82f6">Yard</tspan>
  </text>
</svg>
